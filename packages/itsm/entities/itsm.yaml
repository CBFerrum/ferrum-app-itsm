- name: CiRelation
  label: Relation
  kind: child
  fields:
    - {name: kind, type: select, options: [Depends On, Runs On, Connects To], default: Depends On, required: true, in_list: true}
    - {name: target, type: link, to: ConfigurationItem, required: true, in_list: true}

- name: ConfigurationItem
  label: Configuration Item
  label_plural: Configuration Items
  kind: master
  module: itsm
  title_field: ci_name
  description: Something IT runs, and what it depends on or runs on. Nothing depends on itself, however far round. Discovery tools report what they find; what people keep is theirs.
  fields:
    - {name: ci_name, type: data, required: true, unique: true, in_list: true, label: Name}
    - {name: ci_type, type: select, options: [Business Service, Application, Server, Database, Network Device, Laptop, Other], default: Application, in_list: true, in_filter: true, label: Type}
    - {name: status, type: select, options: [Planned, Live, Retired], default: Live, in_list: true, in_filter: true}
    - {name: environment, type: select, options: [Production, Staging, Test, Development], default: Production, in_list: true, in_filter: true}
    - {name: criticality, type: select, options: [Low, Medium, High, Critical], default: Medium, in_list: true, in_filter: true}
    - {name: owner, type: email, in_list: true}
    - {name: serial_number, type: data}
    - {name: location, type: data}
    - {name: relations, type: table, of: CiRelation}
    - {name: notes, type: text}
    - {name: discovered_by, type: data, read_only: true, no_copy: true, in_filter: true, description: "The discovery source that reports it"}
    - {name: discovery_key, type: data, read_only: true, no_copy: true, description: "What its discovery source calls it"}
    - {name: last_seen_at, type: datetime, label: Last Seen, read_only: true, no_copy: true, description: "When its discovery source last reported it"}
    - {name: missing_since, type: date, label: Not Seen Since, read_only: true, no_copy: true, in_list: true, in_filter: true, description: "Its discovery source has not reported it for 7 days, since this day: to look into, never retired by itself"}
    - {name: discovered, type: json, label: Discovered Details, read_only: true, no_copy: true, description: "What its discovery source last said of it: its system, addresses, hardware"}
  unique: [[discovered_by, discovery_key]]
  list: {columns: [ci_name, ci_type, status, environment, criticality, owner, missing_since], sort: ci_name asc}

- name: OfferingQuestion
  label: Question
  kind: child
  fields:
    - {name: label, type: data, required: true, in_list: true}
    - {name: qtype, type: select, options: [Text, Number, Date, Yes/No, Choice], default: Text, required: true, in_list: true, label: Answered As}
    - {name: required, type: check, in_list: true}
    - {name: options, type: data, visible_if: "doc.qtype == 'Choice'", required_if: "doc.qtype == 'Choice'", description: "The choices, separated by commas"}
    - {name: only_when, type: data, label: Only When Question, description: "The label of an earlier question; this one is asked only when that one has the answer below"}
    - {name: only_when_answer, type: data, label: Has the Answer, required_if: "!isEmpty(doc.only_when)"}

- name: RequestAnswer
  label: Answer
  kind: child
  fields:
    - {name: question, type: data, required: true, in_list: true}
    - {name: answer, type: text, in_list: true}

- name: ServiceOffering
  label: Service Offering
  label_plural: Service Catalog
  kind: master
  module: itsm
  title_field: offering_name
  description: Something people may ask IT for, with how long it takes and whether it needs approval.
  fields:
    - {name: offering_name, type: data, required: true, unique: true, in_list: true}
    - {name: description, type: text}
    - {name: service, type: link, to: ConfigurationItem, in_list: true}
    - {name: needs_approval, type: check, in_list: true}
    - {name: response_hours, type: int, required: true, default: 4, min: 1, in_list: true, label: Hours to Respond, description: "Working hours on the calendar itsm_hours"}
    - {name: fulfil_hours, type: int, required: true, default: 24, min: 1, in_list: true, label: Hours to Fulfil, description: "Working hours on the calendar itsm_hours"}
    - {name: fulfilment_group, type: link, to: ItGroup, in_filter: true, description: "The group that fulfils requests for it: they are assigned to it as they are asked"}
    - {name: questions, type: table, of: OfferingQuestion}
    - {name: active, type: check, default: true, in_list: true, in_filter: true}
  list: {columns: [offering_name, service, needs_approval, fulfil_hours, fulfilment_group, active], sort: offering_name asc}

- name: CatalogRequest
  label: Catalog Request
  label_plural: Catalog Requests
  kind: master
  module: itsm
  title_field: offering
  description: Someone asking for something in the catalog; approved first when the offering needs it, by someone other than who asked.
  fields:
    - {name: offering, type: link, to: ServiceOffering, required: true, in_list: true, in_filter: true}
    - {name: requested_by, type: email, read_only: true, no_copy: true, in_list: true, description: "Who asked for it"}
    - {name: caller_email, type: email, in_list: true, in_filter: true, label: Caller, description: "Who it is for: a user's address (the person asking when left empty), or the contact of someone outside"}
    - {name: caller_name, type: data, label: Caller Name, description: "For someone outside, who has no account"}
    - {name: caller_phone, type: phone, label: Caller Phone}
    - {name: category, type: link, to: ItCategory, in_filter: true}
    - {name: subcategory, type: link, to: ItCategory, in_filter: true}
    - {name: assignment_group, type: link, to: ItGroup, in_list: true, in_filter: true}
    - {name: assigned_to, type: email, in_list: true, in_filter: true, label: Assignee, description: "One of the assignment group's members"}
    - {name: answers, type: table, of: RequestAnswer, description: "The answers to the offering's questions"}
    - {name: status, type: select, options: [Submitted, Approved, Awaiting Caller, Rejected, Fulfilled, Cancelled], default: Submitted, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: respond_by, type: datetime, no_copy: true, label: Respond By}
    - {name: respond_state, type: select, options: [running, paused, met, met_late, breached], no_copy: true, in_filter: true, label: Response Target}
    - {name: due_at, type: datetime, no_copy: true, in_list: true, label: Due}
    - {name: fulfil_state, type: select, options: [running, paused, met, met_late, breached], no_copy: true, in_list: true, in_filter: true, label: Fulfilment Target}
    - {name: decided_by, type: email, read_only: true, no_copy: true}
    - {name: decision_note, type: text, read_only: true, no_copy: true}
    - {name: fulfilled_at, type: datetime, read_only: true, no_copy: true}
  actions:
    - {name: approve_request, label: Approve It, permission: write, condition: "doc.status == 'Submitted'"}
    - {name: reject_request, label: Reject It, permission: write, condition: "doc.status == 'Submitted'", params: [{name: note, type: text, label: Why, required: true}]}
    - {name: fulfil, label: Fulfil It, permission: write, condition: "doc.status == 'Submitted' || doc.status == 'Approved'"}
    - {name: cancel_request, label: Cancel It, permission: write, condition: "doc.status == 'Submitted' || doc.status == 'Approved'"}
  rules:
    - {name: subcategory_of_category, check: "isEmpty(doc.subcategory) || (!isEmpty(doc.category) && links.subcategory.parent == doc.category)", field: subcategory, message: "must be a subcategory of the category"}
  targets:
    - {name: respond, label: Response, calendar: itsm_hours, within: "'PT' + string(links.offering.response_hours) + 'H'", pause_when: "doc.status == 'Awaiting Caller'", met_when: "doc.status != 'Submitted' && doc.status != 'Awaiting Caller'", due_field: respond_by, state_field: respond_state}
    - {name: fulfil, label: Fulfilment, calendar: itsm_hours, within: "'PT' + string(links.offering.fulfil_hours) + 'H'", pause_when: "doc.status == 'Awaiting Caller'", met_when: "doc.status == 'Fulfilled' || doc.status == 'Rejected' || doc.status == 'Cancelled'", due_field: due_at, state_field: fulfil_state}
  numbering: {template: "REQ-{YYYY}-{seq:5}"}
  list: {columns: [number, offering, requested_by, status, due_at, fulfil_state], sort: created_at desc}

- name: Incident
  label: Incident
  label_plural: Incidents
  kind: master
  module: itsm
  title_field: title
  description: Something broken, reported by a caller. Its impact and urgency give its priority through the Priority Matrix, and the priority its response and resolution targets.
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: description, type: text}
    - {name: caller_email, type: email, in_list: true, in_filter: true, label: Caller, description: "Who is affected: a user's address (filled from the person raising it when left empty), or the contact of someone outside"}
    - {name: caller_name, type: data, label: Caller Name, description: "For someone outside, who has no account"}
    - {name: caller_phone, type: phone, label: Caller Phone}
    - {name: reported_by, type: email, label: Reported By, description: "Who reported it, when not the caller"}
    - {name: category, type: link, to: ItCategory, in_filter: true}
    - {name: subcategory, type: link, to: ItCategory, in_filter: true}
    - {name: service, type: link, to: ConfigurationItem, in_filter: true, label: Business Service, description: "The business service affected"}
    - {name: ci, type: link, to: ConfigurationItem, in_list: true, in_filter: true, label: Affected Item}
    - {name: impact, type: select, options: [High, Medium, Low], default: Medium, required: true, in_list: true}
    - {name: urgency, type: select, options: [High, Medium, Low], default: Medium, required: true, in_list: true}
    - {name: matrix, type: link, to: PriorityMatrix, read_only: true, no_copy: true, label: Priority Matrix Row}
    - {name: matrix_missing, type: check, read_only: true, no_copy: true, in_filter: true, label: Matrix Had No Row, description: "The Priority Matrix had no row for this impact and urgency, so the incident took priority P3 and the four and 24 working hours of the shipped P3 row"}
    - {name: priority, type: select, options: [P1, P2, P3, P4], read_only: true, in_list: true, in_filter: true}
    - {name: major, type: check, read_only: true, in_filter: true, description: "P1 on a critical item"}
    - {name: status, type: select, options: [New, In Progress, On Hold, Awaiting Caller, Resolved, Closed], default: New, in_list: true, in_filter: true, description: "Awaiting Caller stops the response and resolution clocks"}
    - {name: assignment_group, type: link, to: ItGroup, in_list: true, in_filter: true}
    - {name: assigned_to, type: email, in_list: true, in_filter: true, label: Assignee, description: "One of the assignment group's members"}
    - {name: problem, type: link, to: Problem, in_filter: true}
    - {name: change, type: link, to: ItChange, in_filter: true, label: Caused By Change, description: "The change whose review opened this incident, or that is known to have caused it"}
    - {name: opened_at, type: datetime, read_only: true, no_copy: true}
    - {name: respond_by, type: datetime, no_copy: true, label: Respond By}
    - {name: respond_state, type: select, options: [running, paused, met, met_late, breached], no_copy: true, in_filter: true, label: Response Target}
    - {name: resolve_by, type: datetime, no_copy: true, in_list: true, label: Resolve By}
    - {name: resolve_state, type: select, options: [running, paused, met, met_late, breached], no_copy: true, in_list: true, in_filter: true, label: Resolution Target}
    - {name: resolution, type: text}
    - {name: resolved_at, type: datetime, read_only: true, no_copy: true}
  rules:
    - {name: subcategory_of_category, check: "isEmpty(doc.subcategory) || (!isEmpty(doc.category) && links.subcategory.parent == doc.category)", field: subcategory, message: "must be a subcategory of the category"}
  actions:
    - name: confirm_resolution
      label: Confirm Resolved
      permission: read
      condition: "doc.status == 'Resolved'"
      effects: [{type: set_fields, values: {status: "'Closed'"}}]
    - name: reject_resolution
      label: Not Resolved
      permission: read
      condition: "doc.status == 'Resolved'"
      params: [{name: note, type: text, label: What is still wrong, required: true}]
      refuse_if: [{when: "daysBetween(doc.resolved_at, today) > settings.ItsmSettings.reopen_days", message: "it was resolved too long ago to reopen; raise a new incident"}]
      effects: [{type: set_fields, values: {status: "'In Progress'"}}, {type: create_document, entity: ItNote, values: {incident: doc.id, visibility: "'Visible to Caller'", body: "'Not resolved: ' + params.note"}}]
  targets:
    - {name: respond, label: Response, calendar: itsm_hours, within: "isEmpty(doc.matrix) ? 'PT4H' : links.matrix.response_time", pause_when: "doc.status == 'Awaiting Caller'", met_when: "doc.status != 'New'", due_field: respond_by, state_field: respond_state}
    - {name: resolve, label: Resolution, calendar: itsm_hours, within: "isEmpty(doc.matrix) ? 'PT24H' : links.matrix.resolution_time", pause_when: "doc.status == 'Awaiting Caller'", met_when: "doc.status == 'Resolved' || doc.status == 'Closed'", due_field: resolve_by, state_field: resolve_state}
  numbering: {template: "INC-{YYYY}-{seq:5}"}
  list: {columns: [number, title, priority, status, assignment_group, assigned_to, resolve_by, resolve_state], sort: created_at desc}

- name: Problem
  label: Problem
  label_plural: Problems
  kind: master
  module: itsm
  title_field: title
  description: The cause behind incidents. A known error has its workaround; resolved, it says its root cause and resolves the incidents still open under it.
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: ci, type: link, to: ConfigurationItem, in_list: true}
    - {name: description, type: text}
    - {name: status, type: select, options: [Open, Known Error, Resolved, Closed], default: Open, in_list: true, in_filter: true}
    - {name: workaround, type: text}
    - {name: root_cause, type: text}
  numbering: {template: "PRB-{YYYY}-{seq:5}"}
  list: {columns: [number, title, ci, status], sort: created_at desc}

- name: ChangeType
  label: Change Type
  label_plural: Change Types
  kind: master
  module: itsm
  title_field: type_name
  description: "A kind of change and the path it takes. Pre-approved: from an approved template it needs no approval. Board: the members of its board decide, N of M. Emergency: a smaller group decides and the change is reviewed afterwards. A workspace adds its own types."
  fields:
    - {name: type_name, type: data, required: true, unique: true, in_list: true, label: Name}
    - {name: path, type: select, options: [Pre-approved, Board, Emergency], default: Board, required: true, in_list: true, in_filter: true, description: "How a change of this type is approved"}
    - {name: board, type: link, to: ItGroup, in_list: true, label: Approving Group, description: "The group whose members decide (a Pre-approved type names it for a change that is not from an approved template). It is an assignment group: its members are the approvers"}
    - {name: quorum, type: int, default: 1, min: 1, max: 5, in_list: true, label: Approvals Needed, description: "How many members of the group must approve (N of M), at most 5"}
    - {name: high_risk_group, type: link, to: ItGroup, label: Group for High Risk, description: "When the questionnaire or the person says High risk, one member of this group approves as well"}
    - {name: review_after, type: check, in_list: true, label: Review Afterwards, description: "After it is implemented the change is reviewed before it can be closed (an emergency change usually is)"}
    - {name: description, type: text}
    - {name: active, type: check, default: true, in_list: true, in_filter: true}
  list: {columns: [type_name, path, board, quorum, review_after, active], sort: type_name asc}

- name: RiskChoice
  label: Choice
  kind: child
  fields:
    - {name: choice_label, type: data, required: true, in_list: true, label: Answer}
    - {name: score, type: int, default: 0, min: 0, max: 100, in_list: true}

- name: RiskQuestion
  label: Risk Question
  label_plural: Risk Questionnaire
  kind: master
  module: itsm
  title_field: question_text
  description: "A question asked of every change. Each answer scores; the scores of the questions that measure risk add up to the change's risk, those that measure impact to its impact, against the thresholds in the IT Services settings."
  fields:
    - {name: question_text, type: data, required: true, unique: true, in_list: true, label: Question}
    - {name: measures, type: select, options: [Risk, Impact], default: Risk, required: true, in_list: true, in_filter: true}
    - {name: position, type: int, default: 10, in_list: true, description: "Questions are asked in this order"}
    - {name: choices, type: table, of: RiskChoice}
    - {name: active, type: check, default: true, in_list: true, in_filter: true}
  list: {columns: [question_text, measures, position, active], sort: position asc}

- name: ChangeAnswer
  label: Answer
  kind: child
  fields:
    - {name: question, type: data, required: true, in_list: true}
    - {name: answer, type: data, required: true, in_list: true}
    - {name: score, type: int, read_only: true, in_list: true}

- name: ChangeItem
  label: Affected Item
  kind: child
  fields:
    - {name: item, type: link, to: ConfigurationItem, required: true, in_list: true, description: "A configuration item or a business service the change touches"}

- name: ChangeTemplate
  label: Change Template
  label_plural: Change Templates
  kind: master
  module: itsm
  title_field: template_name
  description: A change done the same way each time, with its plan, back-out plan and test plan. Once a Change Manager approves it, a change raised from it on a Pre-approved type needs no further approval.
  fields:
    - {name: template_name, type: data, required: true, unique: true, in_list: true, label: Name}
    - {name: change_type, type: link, to: ChangeType, required: true, in_list: true}
    - {name: ci, type: link, to: ConfigurationItem, in_list: true, label: Item Changed}
    - {name: risk, type: select, options: [Low, Medium, High], default: Low}
    - {name: change_plan, type: text, label: Plan}
    - {name: backout_plan, type: text}
    - {name: test_plan, type: text}
    - {name: approved, type: check, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: approved_by, type: email, read_only: true, no_copy: true}
    - {name: active, type: check, default: true, in_list: true}
  actions:
    - {name: approve_template, label: Approve Template, permission: write, roles: [Change Manager], condition: "!doc.approved", effects: [{type: set_fields, values: {approved: "true", approved_by: "user.email"}}]}
    - {name: withdraw_template, label: Withdraw Approval, permission: write, roles: [Change Manager], condition: "doc.approved", effects: [{type: set_fields, values: {approved: "false"}}]}
    - name: raise_change
      label: Raise a Change
      permission: read
      condition: "doc.active && doc.approved"
      params:
        - {name: title, type: data, label: Title, required: true}
        - {name: planned_start, type: datetime, label: Starts, required: true}
        - {name: planned_end, type: datetime, label: Ends, required: true}
      effects:
        - type: create_document
          entity: ItChange
          values: {title: params.title, ci: doc.ci, change_type: doc.change_type, template: doc.id, risk: doc.risk, change_plan: doc.change_plan, backout_plan: doc.backout_plan, test_plan: doc.test_plan, planned_start: params.planned_start, planned_end: params.planned_end}
  list: {columns: [template_name, change_type, ci, risk, approved, active], sort: template_name asc}

- name: ItChange
  label: Change
  label_plural: Changes
  kind: master
  module: itsm
  title_field: title
  description: A change to something IT runs, of a type that sets its path to approval. With the change board on, a normal change is approved by N of the members of a group, an emergency one by a smaller group and reviewed afterwards, and one raised from an approved template by no one; no two approved changes touch one item at once.
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: change_type, type: link, to: ChangeType, in_list: true, in_filter: true, label: Type, description: "Left empty, the type named like the class below, or the first of that path"}
    - {name: ci, type: link, to: ConfigurationItem, required: true, in_list: true, in_filter: true, label: Item Changed}
    - {name: affected, type: table, of: ChangeItem, label: Also Affects, description: "Other services and configuration items the change touches"}
    - {name: kind, type: select, options: [Standard, Normal, Emergency], default: Normal, required: true, in_list: true, in_filter: true, label: Class, description: "Follows the type's path: Pre-approved is Standard, Board is Normal, Emergency is Emergency. A change made without a type names one of these and takes the type of that name"}
    - {name: template, type: link, to: ChangeTemplate, label: Raised From Template}
    - {name: risk_answers, type: table, of: ChangeAnswer, label: Risk Questionnaire, description: "The answer to each question of the risk questionnaire; with any answered, risk and impact are worked out from them"}
    - {name: risk, type: select, options: [Low, Medium, High], default: Medium, in_list: true}
    - {name: risk_score, type: int, read_only: true, no_copy: true}
    - {name: impact_score, type: int, read_only: true, no_copy: true}
    - {name: impact_level, type: select, options: [Low, Medium, High], read_only: true, no_copy: true, label: Impact}
    - {name: planned_start, type: datetime, required: true, in_list: true}
    - {name: planned_end, type: datetime, required: true}
    - {name: change_plan, type: text, label: Plan}
    - {name: backout_plan, type: text}
    - {name: test_plan, type: text}
    - {name: impacted, type: text, read_only: true, description: "The items that depend on or run on it, however far round"}
    - {name: window_flags, type: text, read_only: true, no_copy: true, description: "Other scheduled changes on the same service or item in the same window, and any freeze it falls in"}
    - {name: path, type: select, options: [Pre-approved, Board, Emergency], read_only: true, no_copy: true, in_filter: true}
    - {name: route, type: select, options: [Pre-approved, Board, Emergency, Manager], read_only: true, no_copy: true, in_filter: true, description: "Who approves it: nobody (Pre-approved), the board, the emergency group, or one Change Manager (the settings say Single Manager)"}
    - {name: quorum, type: int, read_only: true, no_copy: true}
    - {name: board_members, type: json, read_only: true, no_copy: true, hidden: true}
    - {name: escalation_members, type: json, read_only: true, no_copy: true, hidden: true}
    - {name: second_look, type: check, read_only: true, no_copy: true, description: "High risk: one member of the type's high-risk group approves too"}
    - {name: review_required, type: check, read_only: true, no_copy: true, in_filter: true}
    - {name: status, type: select, options: [Draft, Submitted, Approved, Implemented, Closed, Rejected, Failed], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: decided_by, type: email, read_only: true, no_copy: true}
    - {name: decision_note, type: text, read_only: true, no_copy: true}
    - {name: implemented_at, type: datetime, read_only: true, no_copy: true}
    - {name: review_outcome, type: select, options: [Successful, Successful with Issues, Failed], read_only: true, no_copy: true, in_filter: true}
    - {name: review_notes, type: text, read_only: true, no_copy: true}
    - {name: reviewed_at, type: datetime, read_only: true, no_copy: true}
    - {name: reviewed_by, type: email, read_only: true, no_copy: true}
  actions:
    - {name: submit_change, label: Submit It, permission: write, condition: "doc.status == 'Draft'"}
    - {name: approve_change, label: Approve It, permission: write, condition: "doc.status == 'Submitted'"}
    - {name: reject_change, label: Reject It, permission: write, condition: "doc.status == 'Submitted'", params: [{name: note, type: text, label: Why, required: true}]}
    - {name: implement, label: Done, permission: write, condition: "doc.status == 'Approved'"}
    - {name: close_change, label: Close It, permission: write, condition: "doc.status == 'Implemented'", params: [{name: note, type: text, label: Review}]}
    - {name: fail_change, label: It Failed, permission: write, condition: "doc.status == 'Implemented'", params: [{name: note, type: text, label: What happened, required: true}]}
    - name: review_change
      label: Review It
      permission: write
      condition: "doc.status == 'Implemented'"
      params:
        - {name: outcome, type: select, options: [Successful, Successful with Issues, Failed], label: Outcome, required: true}
        - {name: note, type: text, label: What we learned}
        - {name: open_incident, type: check, label: Open an incident for it}
  numbering: {template: "CHG-{YYYY}-{seq:5}"}
  list: {columns: [number, title, ci, change_type, risk, planned_start, status], sort: planned_start desc}

- name: ChangeFreeze
  label: Change Freeze
  label_plural: Change Freezes
  kind: master
  module: itsm
  title_field: reason
  description: A time no normal change is scheduled in; emergencies only.
  fields:
    - {name: reason, type: data, required: true, in_list: true}
