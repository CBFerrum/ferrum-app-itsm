id: itsm
name: IT Services
version: 0.2.13
publisher: cbferrum
summary: "Configuration items and their dependencies, discovered or kept by hand, a service catalog, incidents by priority with their targets, problems, and changes with approval, conflicts, freezes and impact"
description: README.md
categories: [support, productivity]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-itsm
support: https://github.com/CBFerrum/ferrum-app-itsm/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [itsm]
uninstall: ask
# Its own interface at /itsm/: open incidents by priority, and changes coming up.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: itsm
      route: itsm
      title: IT Services
      description: Incidents, requests, problems, changes and configuration items
      icon: headset
      color: "#0369a1"
      roles: [Service Desk, Change Manager, Configuration Manager, Requester]
  shell.open:
    - {id: itsm, package: itsm, path: "itsm/e/{entity}/{id}", list: "itsm/e/{entity}"}
  shell.create:
    - {id: incident, label: Incident, path: itsm/e/Incident/new, entity: Incident}
    - {id: request, label: Catalog Request, path: itsm/e/CatalogRequest/new, entity: CatalogRequest}
    - {id: change, label: Change, path: itsm/e/ItChange/new, entity: ItChange}
  # The kind of notification IT Services sends ({app}.{id}, as src/discovery.rs sends it); each
  # person chooses how it reaches them.
  shell.notification:
    - {id: missing, label: Configuration items you own that discovery no longer finds, default: [inapp]}
  # What the assistant should know in IT Services's pages, and what it suggests asking there.
  shell.assistant:
    - id: itsm
      title: "IT Services"
      instructions: >-
        A ConfigurationItem (Planned, Live, Retired), with its dependencies (CiRelation), is what IT runs. An Incident
        (New, In Progress, On Hold, Resolved, Closed) has a priority and its targets; a Problem (Open, Known Error,
        Resolved, Closed) is the cause behind incidents. An ItChange (Draft, Submitted, Approved, Implemented, Closed,
        Rejected, Failed) needs approval and must keep out of a ChangeFreeze. A CatalogRequest is what someone asked
        for from the catalog (ServiceOffering).
      suggestions:
        - "Which high-priority incidents are open?"
        - "What changes are planned this week?"
        - "What depends on a given server?"
        - "Which requests wait for approval?"
